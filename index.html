<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chat 💬</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:#181818;
    display:flex;
    flex-direction:column;
}

header{
    padding:25px 20px;
    text-align:center;
    background:linear-gradient(135deg,#6a0dad,#9b30ff);
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:7px 0 0;
    opacity:.85;
}

.content{
    flex:1;
    padding:25px 20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:16px;
    margin-bottom:15px;
    border:none;
    border-radius:12px;
    background:#292929;
    color:white;
    font-size:16px;
    outline:none;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#8a2be2;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

footer{
    padding:15px;
    text-align:center;
    font-size:12px;
    color:#777;
}

</style>

</head>

<body>

<div class="container">

<header>

<h1>💬 Chat</h1>

<p>Converse com seus amigos</p>

</header>

<div class="content">

<h2>Entrar no Chat</h2>

<input
type="text"
id="nome"
placeholder="Digite seu nome"
>

<input
type="text"
id="whatsapp"
placeholder="WhatsApp (opcional)"
>

<button onclick="entrar()">
Entrar 💬
</button>

</div>

<footer>
Chat App
</footer>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL =
"https://fviycyrnixbodpsilxuo.supabase.co";

const SUPABASE_KEY =
"COLE_AQUI_SUA_PUBLISHABLE_KEY";

const supabase =
createClient(SUPABASE_URL, SUPABASE_KEY);


window.entrar = async function(){

    const nome =
        document.getElementById("nome").value.trim();

    const whatsapp =
        document.getElementById("whatsapp").value.trim();


    if(!nome){

        alert("Digite seu nome.");

        return;
    }


    const { data, error } =
        await supabase
        .from("usuarios")
        .insert({

            nome: nome,

            whatsapp: whatsapp || null

        })
        .select()
        .single();


    if(error){

        console.error(error);

        alert(
            "Erro ao cadastrar usuário:\n" +
            error.message
        );

        return;
    }


    localStorage.setItem(
        "chat_usuario_id",
        data.id
    );

    localStorage.setItem(
        "chat_nome",
        data.nome
    );


    alert(
        "Cadastro realizado! 👋\n\n" +
        "Bem-vindo, " + data.nome + "!"
    );

};

</script>

</body>

</html>
