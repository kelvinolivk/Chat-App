<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chat 💬</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:#181818;
    display:flex;
    flex-direction:column;
}

header{
    padding:25px 20px;
    text-align:center;
    background:linear-gradient(135deg,#6a0dad,#9b30ff);
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:7px 0 0;
    opacity:.85;
}

.content{
    flex:1;
    padding:25px 20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:16px;
    margin-bottom:15px;
    border:none;
    border-radius:12px;
    background:#292929;
    color:white;
    font-size:16px;
    outline:none;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#8a2be2;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

footer{
    padding:15px;
    text-align:center;
    font-size:12px;
    color:#777;
}

</style>

</head>

<body>

<div class="container">

<header>

<h1>💬 Chat</h1>

<p>Converse com seus amigos</p>

</header>

<div class="content">

<h2>Entrar no Chat</h2>

<input
type="text"
id="nome"
placeholder="Digite seu nome"
>

<input
type="text"
id="whatsapp"
placeholder="WhatsApp (opcional)"
>

<button onclick="entrar()">
Entrar 💬
</button>

</div>

<footer>
Chat App
</footer>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const SUPABASE_URL =
"https://fviycyrnixbodpsilxuo.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MNkJhCDo4ToSb98V2rBPNA_Ubphvhw1";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


window.entrar = async function(){

    const nome =
        document
        .getElementById("nome")
        .value
        .trim();


    const whatsapp =
        document
        .getElementById("whatsapp")
        .value
        .trim();


    if(!nome){

        alert(
            "Digite seu nome."
        );

        return;
    }


    /*
     * PRIMEIRO:
     * tentar recuperar o usuário
     * que já está salvo neste aparelho
     */

    const usuarioSalvo =
        localStorage.getItem(
            "chat_usuario_id"
        );


    if(usuarioSalvo){

        const { data, error } =
            await supabase
            .from("usuarios")
            .select("id,nome,whatsapp")
            .eq(
                "id",
                usuarioSalvo
            )
            .maybeSingle();


        if(!error && data){

            localStorage.setItem(
                "chat_usuario_id",
                data.id
            );

            localStorage.setItem(
                "chat_nome",
                data.nome
            );


            window.location.href =
                "chat.html";

            return;
        }

    }


    /*
     * SEGUNDO:
     * se informou WhatsApp,
     * procurar usuário existente
     */

    if(whatsapp){

        const { data, error } =
            await supabase
            .from("usuarios")
            .select("id,nome,whatsapp")
            .eq(
                "whatsapp",
                whatsapp
            )
            .maybeSingle();


        if(error){

            console.error(error);

        }


        if(data){

            localStorage.setItem(
                "chat_usuario_id",
                data.id
            );

            localStorage.setItem(
                "chat_nome",
                data.nome
            );


            window.location.href =
                "chat.html";

            return;
        }

    }


    /*
     * TERCEIRO:
     * criar novo usuário somente
     * quando realmente não existir
     */

    const { data, error } =
        await supabase
        .from("usuarios")
        .insert({

            nome:
                nome,

            whatsapp:
                whatsapp || null

        })
        .select()
        .single();


    if(error){

        console.error(error);

        alert(
            "Erro ao cadastrar usuário:\n" +
            error.message
        );

        return;
    }


    localStorage.setItem(
        "chat_usuario_id",
        data.id
    );

    localStorage.setItem(
        "chat_nome",
        data.nome
    );


    alert(
        "Bem-vindo, " +
        data.nome +
        "! 👋"
    );


    window.location.href =
        "chat.html";

};

</script>

</body>

</html>
