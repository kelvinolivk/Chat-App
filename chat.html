<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Fifi 💋</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;

    background:
        radial-gradient(circle at 10% 15%,rgba(255,20,147,.25),transparent 25%),
        radial-gradient(circle at 90% 30%,rgba(155,48,255,.25),transparent 28%),
        linear-gradient(135deg,#170916,#2a0b32,#120817);
}

.container{
    width:100%;
    max-width:430px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

.container::before{
    content:"💋   ✨   💕   ✨   💋   💕";
    position:absolute;
    top:120px;
    left:-20px;
    right:-20px;
    font-size:26px;
    letter-spacing:14px;
    line-height:90px;
    opacity:.07;
    transform:rotate(-10deg);
    pointer-events:none;
}

.container::after{
    content:"💕     ✨      💋      ✨     💕";
    position:absolute;
    bottom:150px;
    left:-20px;
    right:-20px;
    font-size:28px;
    line-height:100px;
    opacity:.06;
    transform:rotate(8deg);
    pointer-events:none;
}

header{
    padding:22px 20px;
    background:linear-gradient(135deg,#ff1493,#c026ff,#7b2cff);
    box-shadow:0 5px 25px rgba(255,20,147,.35);
    position:relative;
    z-index:5;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.usuario{
    margin-top:5px;
    font-size:14px;
    opacity:.9;
}

.content{
    flex:1;
    padding:20px;
    position:relative;
    z-index:2;
}

.titulo{
    font-size:21px;
    font-weight:bold;
    margin-bottom:15px;
}

.lista{
    display:flex;
    flex-direction:column;
}

.conversa{
    display:flex;
    align-items:center;
    gap:13px;
    padding:15px 5px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.area-conversa{
    flex:1;
    display:flex;
    align-items:center;
    gap:13px;
    min-width:0;
    cursor:pointer;
}

.avatar{
    width:54px;
    height:54px;
    min-width:54px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:bold;
    background:linear-gradient(135deg,#ff1493,#8a2be2);
    box-shadow:0 4px 15px rgba(255,20,147,.25);
}

.info{
    flex:1;
    min-width:0;
}

.nome{
    font-size:17px;
    font-weight:bold;
    margin-bottom:6px;
}

.ultima{
    color:#c8a9ca;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.area-direita{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;
}

.hora{
    color:#b994ba;
    font-size:11px;
}

.nao-lidas{
    min-width:23px;
    height:23px;
    padding:0 6px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff1493,#8a2be2);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
}

.apagar{
    width:38px;
    height:38px;
    min-width:38px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    color:#ff9ccc;
    font-size:17px;
    cursor:pointer;
}

.vazio{
    text-align:center;
    color:#c9a7ca;
    padding:45px 15px;
    line-height:1.7;
}

.sair{
    margin-top:25px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:25px;
    background:rgba(255,255,255,.08);
    color:#e7c8e8;
    font-size:15px;
    border:1px solid rgba(255,255,255,.08);
}

</style>

</head>

<body>

<div class="container">

<header>

<div class="logo">
💋 Fifi
</div>

<div class="usuario" id="usuarioAtual">
Carregando...
</div>

</header>

<div class="content">

<div class="titulo">
Contatos 💕
</div>

<div class="lista" id="listaUsuarios">

<div class="vazio">
Carregando usuários...
</div>

</div>

<button class="sair" onclick="sair()">
🚪 Sair
</button>

</div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const SUPABASE_URL =
"https://fviycyrnixbodpsilxuo.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MNkJhCDo4ToSb98V2rBPNA_Ubphvhw1";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const usuarioId =
localStorage.getItem("chat_usuario_id");


const usuarioNome =
localStorage.getItem("chat_nome");


if(!usuarioId){

    window.location.href =
        "index.html";

    throw new Error(
        "Usuário não identificado."
    );

}


document.getElementById(
    "usuarioAtual"
).textContent =
"Olá, " + usuarioNome + " 💕";


// ================================
// CARREGAR CONTATOS
// ================================

async function carregarUsuarios(){

    const lista =
        document.getElementById(
            "listaUsuarios"
        );


    const { data: usuarios, error } =
        await supabase
        .from("usuarios")
        .select("id,nome,whatsapp")
        .neq(
            "id",
            usuarioId
        )
        .order(
            "nome",
            {
                ascending:true
            }
        );


    if(error){

        console.error(error);

        lista.innerHTML = `
            <div class="vazio">
                Erro ao carregar contatos.
                <br><br>
                ${error.message}
            </div>
        `;

        return;
    }


    if(!usuarios || usuarios.length === 0){

        lista.innerHTML = `
            <div class="vazio">
                💋
                <br><br>
                Ainda não existem outros usuários.
                <br>
                Quando alguém se cadastrar,
                aparecerá aqui. 💕
            </div>
        `;

        return;
    }


    // Buscar mensagens do usuário atual

    const { data: mensagens, error: erroMensagens } =
        await supabase
        .from("mensagens")
        .select("*")
        .or(
            `remetente_id.eq.${usuarioId},destinatario_id.eq.${usuarioId}`
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(erroMensagens){

        console.error(
            erroMensagens
        );

    }


    lista.innerHTML = "";


    usuarios.forEach(usuario => {

        const mensagensDaPessoa =
            (mensagens || []).filter(
                msg =>

                (
                    String(msg.remetente_id) ===
                    String(usuario.id)
                )

                ||

                (
                    String(msg.destinatario_id) ===
                    String(usuario.id)
                )
            );


        const ultimaMensagem =
            mensagensDaPessoa.length > 0
            ? mensagensDaPessoa[0]
            : null;


        let textoUltima =
            "Toque para iniciar uma conversa 💕";


        let horario =
            "";


        if(ultimaMensagem){

            textoUltima =
                ultimaMensagem.mensagem;


            const dataMensagem =
                new Date(
                    ultimaMensagem.created_at
                );


            horario =
                dataMensagem.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        }


        const naoLidas =
            mensagensDaPessoa.filter(
                msg =>

                String(
                    msg.destinatario_id
                ) ===
                String(usuarioId)

                &&

                msg.lida === false

            ).length;


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "conversa";


        const inicial =
            usuario.nome
            .charAt(0)
            .toUpperCase();


        div.innerHTML = `

            <div class="area-conversa">

                <div class="avatar">
                    ${inicial}
                </div>

                <div class="info">

                    <div class="nome">
                        ${usuario.nome}
                    </div>

                    <div class="ultima">
                        ${textoUltima}
                    </div>

                </div>

            </div>

            <div class="area-direita">

                ${
                    horario
                    ?
                    `<div class="hora">
                        ${horario}
                    </div>`
                    :
                    ""
                }

                ${
                    naoLidas > 0
                    ?
                    `<div class="nao-lidas">
                        ${naoLidas}
                    </div>`
                    :
                    ""
                }

            </div>

            ${
                mensagensDaPessoa.length > 0
                ?
                `
                <button
                    class="apagar"
                    title="Apagar conversa">
                    🗑️
                </button>
                `
                :
                ""
            }

        `;


        // ================================
        // ABRIR CONVERSA
        // ================================

        div.querySelector(
            ".area-conversa"
        ).onclick = function(){

            localStorage.setItem(
                "chat_destinatario_id",
                String(usuario.id)
            );


            window.location.href =
                "conversa.html";

        };


        // ================================
        // APAGAR CONVERSA
        // ================================

        const botaoApagar =
            div.querySelector(
                ".apagar"
            );


        if(botaoApagar){

            botaoApagar.onclick =
            async function(event){

                event.stopPropagation();


                const confirmar =
                    confirm(
                        "🗑️ Apagar conversa com " +
                        usuario.nome +
                        "?\n\n" +
                        "Todas as mensagens dessa conversa serão apagadas."
                    );


                if(!confirmar){

                    return;

                }


                const { error } =
                    await supabase
                    .from("mensagens")
                    .delete()
                    .or(
                        `and(remetente_id.eq.${usuarioId},destinatario_id.eq.${usuario.id}),and(remetente_id.eq.${usuario.id},destinatario_id.eq.${usuarioId})`
                    );


                if(error){

                    console.error(error);

                    alert(
                        "Erro ao apagar conversa:\n" +
                        error.message
                    );

                    return;

                }


                carregarUsuarios();

            };

        }


        lista.appendChild(
            div
        );

    });

}


// ================================
// SAIR
// ================================

window.sair = function(){

    /*
     * NÃO apagar:
     *
     * chat_usuario_id
     * chat_nome
     *
     * Assim o mesmo aparelho
     * continua usando o mesmo usuário.
     */

    localStorage.removeItem(
        "chat_destinatario_id"
    );


    window.location.href =
        "index.html";

};


// ================================
// NOVO USUÁRIO
// ================================

supabase
.channel(
    "lista-contatos"
)
.on(
    "postgres_changes",
    {
        event:"INSERT",
        schema:"public",
        table:"usuarios"
    },
    function(){

        carregarUsuarios();

    }
)
.subscribe();


// ================================
// NOVA MENSAGEM
// ================================

supabase
.channel(
    "lista-mensagens"
)
.on(
    "postgres_changes",
    {
        event:"INSERT",
        schema:"public",
        table:"mensagens"
    },
    function(){

        carregarUsuarios();

    }
)
.subscribe();


carregarUsuarios();

</script>

</body>

</html>
