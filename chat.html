<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chat 💬</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:#181818;
}

header{
    padding:20px;
    background:linear-gradient(135deg,#6a0dad,#9b30ff);
}

header h1{
    margin:0;
    font-size:25px;
}

.usuario{
    margin-top:6px;
    font-size:14px;
    opacity:.85;
}

.content{
    padding:20px;
}

.titulo{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.pessoa{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px;
    background:#252525;
    border-radius:14px;
    cursor:pointer;
}

.pessoa:hover{
    background:#303030;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#8a2be2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
}

.nome{
    font-size:16px;
    font-weight:bold;
}

.status{
    font-size:12px;
    color:#aaa;
    margin-top:4px;
}

.vazio{
    text-align:center;
    color:#888;
    padding:30px 10px;
}

button{
    margin-top:20px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#292929;
    color:white;
    font-size:15px;
}

</style>

</head>

<body>

<div class="container">

<header>

<h1>💬 Chat</h1>

<div class="usuario" id="usuarioAtual">
Carregando...
</div>

</header>

<div class="content">

<div class="titulo">
Pessoas disponíveis
</div>

<div
class="lista"
id="listaUsuarios">

<div class="vazio">
Carregando usuários...
</div>

</div>

<button onclick="sair()">
Sair
</button>

</div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const SUPABASE_URL =
"https://fviycyrnixbodpsilxuo.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MNkJhCDo4ToSb98V2rBPNA_Ubphvhw1";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// Usuário logado

const usuarioId =
localStorage.getItem("chat_usuario_id");

const usuarioNome =
localStorage.getItem("chat_nome");


if(!usuarioId){

    alert("Você precisa entrar primeiro.");

    window.location.href = "index.html";

}


document.getElementById("usuarioAtual").textContent =
"Olá, " + usuarioNome + " 👋";


// Buscar usuários

async function carregarUsuarios(){

    const lista =
        document.getElementById("listaUsuarios");


    const { data, error } =
        await supabase
        .from("usuarios")
        .select("id,nome,whatsapp")
        .neq("id", usuarioId)
        .order("nome");


    if(error){

        console.error(error);

        lista.innerHTML = `
            <div class="vazio">
                Erro ao carregar usuários.
            </div>
        `;

        return;
    }


    if(!data || data.length === 0){

        lista.innerHTML = `
            <div class="vazio">
                Ainda não existem outros usuários.
                <br><br>
                Compartilhe o app com um amigo! 💜
            </div>
        `;

        return;
    }


    lista.innerHTML = "";


    data.forEach(usuario => {

        const div =
            document.createElement("div");

        div.className = "pessoa";


        const inicial =
            usuario.nome
            .charAt(0)
            .toUpperCase();


        div.innerHTML = `

            <div class="avatar">
                ${inicial}
            </div>

            <div>

                <div class="nome">
                    ${usuario.nome}
                </div>

                <div class="status">
                    Toque para conversar 💬
                </div>

            </div>

        `;


        div.onclick = function(){

            abrirConversa(usuario.id);

        };


        lista.appendChild(div);

    });

}


// Abrir conversa

function abrirConversa(id){

    localStorage.setItem(
        "chat_destinatario_id",
        id
    );

    window.location.href =
        "conversa.html";

}


// Sair

window.sair = function(){

    localStorage.removeItem(
        "chat_usuario_id"
    );

    localStorage.removeItem(
        "chat_nome"
    );

    window.location.href =
        "index.html";

};


// Iniciar

carregarUsuarios();

</script>

</body>

</html>
