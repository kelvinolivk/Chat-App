<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chat 💬</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:#181818;
    display:flex;
    flex-direction:column;
}

header{
    padding:22px 20px;
    background:linear-gradient(135deg,#6a0dad,#9b30ff);
}

header h1{
    margin:0;
    font-size:27px;
}

.usuario{
    margin-top:6px;
    font-size:14px;
    opacity:.85;
}

.content{
    flex:1;
    padding:18px;
}

.titulo{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.lista{
    display:flex;
    flex-direction:column;
}

.conversa{
    display:flex;
    align-items:center;
    gap:13px;
    padding:15px 5px;
    border-bottom:1px solid #292929;
    cursor:pointer;
}

.conversa:active{
    background:#252525;
}

.avatar{
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    background:#8a2be2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:bold;
}

.info{
    flex:1;
    min-width:0;
}

.nome{
    font-size:17px;
    font-weight:bold;
    margin-bottom:6px;
}

.ultima{
    color:#999;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.hora{
    color:#888;
    font-size:11px;
    align-self:flex-start;
    margin-top:3px;
}

.nao-lidas{
    min-width:22px;
    height:22px;
    padding:0 6px;
    border-radius:12px;
    background:#8a2be2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    margin-top:7px;
}

.area-direita{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
}

.vazio{
    text-align:center;
    color:#888;
    padding:40px 15px;
    line-height:1.6;
}

button{
    margin-top:20px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#292929;
    color:white;
    font-size:15px;
}

</style>

</head>

<body>

<div class="container">

<header>

<h1>💬 Chat</h1>

<div class="usuario" id="usuarioAtual">
Carregando...
</div>

</header>


<div class="content">

<div class="titulo">
Conversas
</div>

<div
class="lista"
id="listaUsuarios">

<div class="vazio">
Carregando conversas...
</div>

</div>

<button onclick="sair()">
Sair
</button>

</div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const SUPABASE_URL =
"https://fviycyrnixbodpsilxuo.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MNkJhCDo4ToSb98V2rBPNA_Ubphvhw1";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const usuarioId =
localStorage.getItem("chat_usuario_id");

const usuarioNome =
localStorage.getItem("chat_nome");


if(!usuarioId){

    window.location.href =
        "index.html";

}


document.getElementById(
    "usuarioAtual"
).textContent =
"Olá, " + usuarioNome + " 👋";


// Carregar usuários e mensagens

async function carregarConversas(){

    const lista =
        document.getElementById(
            "listaUsuarios"
        );


    const { data: usuarios, error } =
        await supabase
        .from("usuarios")
        .select("id,nome,whatsapp")
        .neq("id", usuarioId)
        .order("nome");


    if(error){

        console.error(error);

        lista.innerHTML = `
            <div class="vazio">
                Erro ao carregar conversas.
            </div>
        `;

        return;
    }


    if(!usuarios || usuarios.length === 0){

        lista.innerHTML = `
            <div class="vazio">
                Ainda não existem outros usuários. 💜
                <br><br>
                Cadastre outro usuário para começar
                uma conversa.
            </div>
        `;

        return;
    }


    const { data: mensagens, error: erroMensagens } =
        await supabase
        .from("mensagens")
        .select("*")
        .or(
            `remetente_id.eq.${usuarioId},destinatario_id.eq.${usuarioId}`
        )
        .order("created_at", {
            ascending:false
        });


    if(erroMensagens){

        console.error(erroMensagens);

    }


    lista.innerHTML = "";


    usuarios.forEach(usuario => {

        const mensagensDaPessoa =
            (mensagens || []).filter(msg =>

                (
                    String(msg.remetente_id) ===
                    String(usuario.id)
                )
                ||
                (
                    String(msg.destinatario_id) ===
                    String(usuario.id)
                )

            );


        const ultimaMensagem =
            mensagensDaPessoa.length > 0
            ? mensagensDaPessoa[0]
            : null;


        const div =
            document.createElement("div");

        div.className =
            "conversa";


        const inicial =
            usuario.nome
            .charAt(0)
            .toUpperCase();


        let textoUltima =
            "Toque para conversar 💬";


        let horario = "";


        let naoLidas = 0;


        if(ultimaMensagem){

            textoUltima =
                ultimaMensagem.mensagem;


            const dataMensagem =
                new Date(
                    ultimaMensagem.created_at
                );


            horario =
                dataMensagem.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        }


        // Contar mensagens recebidas e não lidas

        naoLidas =
            mensagensDaPessoa.filter(msg =>

                String(msg.destinatario_id) ===
                String(usuarioId)

                &&

                msg.lida === false

            ).length;


        div.innerHTML = `

            <div class="avatar">
                ${inicial}
            </div>

            <div class="info">

                <div class="nome">
                    ${usuario.nome}
                </div>

                <div class="ultima">
                    ${textoUltima}
                </div>

            </div>

            <div class="area-direita">

                <div class="hora">
                    ${horario}
                </div>

                ${
                    naoLidas > 0
                    ? `<div class="nao-lidas">${naoLidas}</div>`
                    : ""
                }

            </div>

        `;


        div.onclick = function(){

            localStorage.setItem(
                "chat_destinatario_id",
                usuario.id
            );


            window.location.href =
                "conversa.html";

        };


        lista.appendChild(div);

    });

}


// Sair

window.sair = function(){

    localStorage.removeItem(
        "chat_usuario_id"
    );

    localStorage.removeItem(
        "chat_nome"
    );

    localStorage.removeItem(
        "chat_destinatario_id"
    );

    window.location.href =
        "index.html";

};


// Atualização das conversas em tempo real

supabase
.channel("lista-conversas")
.on(
    "postgres_changes",
    {
        event:"INSERT",
        schema:"public",
        table:"mensagens"
    },
    function(){

        carregarConversas();

    }
)
.subscribe();


carregarConversas();

</script>

</body>

</html>
