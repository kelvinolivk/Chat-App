<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Fifi 💋</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;

    display:flex;
    justify-content:center;

    background:
        radial-gradient(
            circle at 10% 15%,
            rgba(255,20,147,.25),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 30%,
            rgba(155,48,255,.25),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #170916,
            #2a0b32,
            #120817
        );
}

.container{
    width:100%;
    max-width:430px;
    min-height:100vh;

    display:flex;
    flex-direction:column;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 20% 70%,
            rgba(255,20,147,.08),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(138,43,226,.10),
            transparent 25%
        );
}


/* DECORAÇÕES */

.container::before{
    content:
        "💋   ✨   💕   ✨   💋   💕";

    position:absolute;

    top:120px;
    left:-20px;
    right:-20px;

    font-size:26px;
    letter-spacing:14px;
    line-height:90px;

    opacity:.07;

    transform:rotate(-10deg);

    pointer-events:none;
}

.container::after{
    content:
        "💕     ✨      💋      ✨     💕";

    position:absolute;

    bottom:150px;
    left:-20px;
    right:-20px;

    font-size:28px;
    line-height:100px;

    opacity:.06;

    transform:rotate(8deg);

    pointer-events:none;
}


/* CABEÇALHO */

header{
    padding:22px 20px;

    background:
        linear-gradient(
            135deg,
            #ff1493,
            #c026ff,
            #7b2cff
        );

    box-shadow:
        0 5px 25px
        rgba(255,20,147,.35);

    position:relative;
    z-index:5;
}

.logo{
    font-size:30px;
    font-weight:bold;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,.3);
}

.usuario{
    margin-top:5px;

    font-size:14px;

    opacity:.9;
}


/* CONTEÚDO */

.content{
    flex:1;

    padding:20px;

    position:relative;
    z-index:2;
}

.titulo{
    font-size:21px;

    font-weight:bold;

    margin-bottom:15px;
}


/* LISTA */

.lista{
    display:flex;
    flex-direction:column;
}

.conversa{
    display:flex;
    align-items:center;

    gap:13px;

    padding:15px 5px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    cursor:pointer;

    border-radius:12px;

    transition:.2s;
}

.conversa:active{
    background:
        rgba(255,20,147,.10);
}


/* AVATAR */

.avatar{
    width:54px;
    height:54px;

    min-width:54px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #ff1493,
            #8a2be2
        );

    box-shadow:
        0 4px 15px
        rgba(255,20,147,.25);
}


/* INFORMAÇÕES */

.info{
    flex:1;
    min-width:0;
}

.nome{
    font-size:17px;
    font-weight:bold;

    margin-bottom:6px;
}

.ultima{
    color:#c8a9ca;

    font-size:14px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* LADO DIREITO */

.area-direita{
    display:flex;
    flex-direction:column;

    align-items:flex-end;
}

.hora{
    color:#b994ba;

    font-size:11px;
}


/* NÃO LIDAS */

.nao-lidas{
    min-width:23px;
    height:23px;

    padding:0 6px;

    margin-top:7px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #ff1493,
            #8a2be2
        );

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:bold;

    box-shadow:
        0 3px 10px
        rgba(255,20,147,.35);
}


/* VAZIO */

.vazio{
    text-align:center;

    color:#c9a7ca;

    padding:45px 15px;

    line-height:1.7;
}


/* BOTÃO SAIR */

button{
    margin-top:25px;

    width:100%;

    padding:14px;

    border:none;

    border-radius:25px;

    background:
        rgba(255,255,255,.08);

    color:#e7c8e8;

    font-size:15px;

    border:
        1px solid
        rgba(255,255,255,.08);

    cursor:pointer;
}

button:active{
    background:
        rgba(255,20,147,.15);
}

</style>

</head>

<body>

<div class="container">

<header>

<div class="logo">
💋 Fifi
</div>

<div
class="usuario"
id="usuarioAtual">

Carregando...

</div>

</header>


<div class="content">

<div class="titulo">
Conversas 💕
</div>


<div
class="lista"
id="listaUsuarios">

<div class="vazio">
Carregando conversas...
</div>

</div>


<button onclick="sair()">
🚪 Sair
</button>

</div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const SUPABASE_URL =
"https://fviycyrnixbodpsilxuo.supabase.co";


const SUPABASE_KEY =
"COLE_AQUI_SUA_PUBLISHABLE_KEY";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const usuarioId =
localStorage.getItem("chat_usuario_id");


const usuarioNome =
localStorage.getItem("chat_nome");


if(!usuarioId){

    window.location.href =
        "index.html";

}


document.getElementById(
    "usuarioAtual"
).textContent =
"Olá, " + usuarioNome + " 💕";


async function carregarConversas(){

    const lista =
        document.getElementById(
            "listaUsuarios"
        );


    const { data: usuarios, error } =
        await supabase
        .from("usuarios")
        .select("id,nome,whatsapp")
        .neq("id", usuarioId)
        .order("nome");


    if(error){

        console.error(error);

        lista.innerHTML = `
            <div class="vazio">
                Erro ao carregar conversas.
            </div>
        `;

        return;
    }


    if(!usuarios || usuarios.length === 0){

        lista.innerHTML = `
            <div class="vazio">

                💋

                <br>

                Ainda não existem outras pessoas.

                <br>

                Cadastre outro usuário para
                começar uma conversa. 💕

            </div>
        `;

        return;
    }


    const { data: mensagens, error: erroMensagens } =
        await supabase
        .from("mensagens")
        .select("*")
        .or(
            `remetente_id.eq.${usuarioId},destinatario_id.eq.${usuarioId}`
        )
        .order("created_at", {
            ascending:false
        });


    if(erroMensagens){

        console.error(erroMensagens);

    }


    lista.innerHTML = "";


    usuarios.forEach(usuario => {

        const mensagensDaPessoa =
            (mensagens || []).filter(msg =>

                String(msg.remetente_id) ===
                String(usuario.id)

                ||

                String(msg.destinatario_id) ===
                String(usuario.id)

            );


        const ultimaMensagem =
            mensagensDaPessoa.length > 0
            ? mensagensDaPessoa[0]
            : null;


        const div =
            document.createElement("div");


        div.className =
            "conversa";


        const inicial =
            usuario.nome
            .charAt(0)
            .toUpperCase();


        let textoUltima =
            "Toque para conversar 💬";


        let horario = "";


        let naoLidas = 0;


        if(ultimaMensagem){

            textoUltima =
                ultimaMensagem.mensagem;


            const dataMensagem =
                new Date(
                    ultimaMensagem.created_at
                );


            horario =
                dataMensagem.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        }


        naoLidas =
            mensagensDaPessoa.filter(msg =>

                String(msg.destinatario_id) ===
                String(usuarioId)

                &&

                msg.lida === false

            ).length;


        div.innerHTML = `

            <div class="avatar">
                ${inicial}
            </div>

            <div class="info">

                <div class="nome">
                    ${usuario.nome}
                </div>

                <div class="ultima">
                    ${textoUltima}
                </div>

            </div>

            <div class="area-direita">

                <div class="hora">
                    ${horario}
                </div>

                ${
                    naoLidas > 0
                    ? `<div class="nao-lidas">
                        ${naoLidas}
                       </div>`
                    : ""
                }

            </div>

        `;


        div.onclick = function(){

            localStorage.setItem(
                "chat_destinatario_id",
                usuario.id
            );


            window.location.href =
                "conversa.html";

        };


        lista.appendChild(div);

    });

}


window.sair = function(){

    localStorage.removeItem(
        "chat_usuario_id"
    );

    localStorage.removeItem(
        "chat_nome"
    );

    localStorage.removeItem(
        "chat_destinatario_id"
    );

    window.location.href =
        "index.html";

};


supabase
.channel("lista-conversas")
.on(
    "postgres_changes",
    {
        event:"INSERT",
        schema:"public",
        table:"mensagens"
    },
    function(){

        carregarConversas();

    }
)
.subscribe();


carregarConversas();

</script>

</body>

</html>
