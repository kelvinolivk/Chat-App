<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Fifi 💋</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;

    background:
        radial-gradient(circle at 15% 20%, rgba(255,105,180,.25), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(155,48,255,.25), transparent 28%),
        linear-gradient(135deg,#170916,#2a0b32,#120817);
}

.container{
    width:100%;
    max-width:430px;
    height:100vh;

    display:flex;
    flex-direction:column;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 20% 70%, rgba(255,20,147,.08), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(138,43,226,.10), transparent 25%);
}

.container::before{
    content:"💋  ✨  💕  ✨  💋  💕  ✨";
    position:absolute;
    top:100px;
    left:-20px;
    right:-20px;

    font-size:25px;
    letter-spacing:20px;
    line-height:80px;

    opacity:.08;
    transform:rotate(-12deg);

    pointer-events:none;
}

.container::after{
    content:"💕     ✨       💋       ✨     💕";
    position:absolute;
    bottom:130px;
    left:-20px;
    right:-20px;

    font-size:28px;
    line-height:90px;

    opacity:.07;
    transform:rotate(10deg);

    pointer-events:none;
}

header{
    padding:14px;

    background:
        linear-gradient(
            135deg,
            #ff1493,
            #c026ff,
            #7b2cff
        );

    display:flex;
    align-items:center;
    gap:12px;

    box-shadow:
        0 4px 25px rgba(255,20,147,.35);

    position:relative;
    z-index:5;
}

.voltar{
    font-size:32px;
    cursor:pointer;
    width:35px;
}

.info{
    flex:1;
}

.info h1{
    margin:0;
    font-size:20px;
    text-shadow:0 2px 8px rgba(0,0,0,.3);
}

.info p{
    margin:4px 0 0;
    font-size:12px;
    opacity:.9;
}

.apagar{
    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.20);

    color:white;
    font-size:18px;

    cursor:pointer;
}

.mensagens{
    flex:1;

    padding:20px 15px;

    overflow-y:auto;

    display:flex;
    flex-direction:column;
    gap:11px;

    position:relative;
    z-index:2;
}

.vazio{
    text-align:center;
    color:#d7a9d8;
    margin:auto;
}

.mensagem{
    max-width:78%;

    padding:12px 15px;

    border-radius:19px;

    word-wrap:break-word;

    font-size:15px;

    box-shadow:
        0 4px 12px rgba(0,0,0,.25);
}

.enviada{
    align-self:flex-end;

    background:
        linear-gradient(
            135deg,
            #ff1493,
            #a72cff
        );

    border-bottom-right-radius:5px;
}

.recebida{
    align-self:flex-start;

    background:
        rgba(255,255,255,.10);

    border:1px solid
        rgba(255,255,255,.08);

    backdrop-filter:blur(8px);

    border-bottom-left-radius:5px;
}

.hora{
    font-size:10px;

    opacity:.7;

    margin-top:5px;

    text-align:right;
}

.area-envio{
    padding:12px;

    background:
        rgba(20,5,25,.92);

    display:flex;
    gap:8px;

    position:relative;
    z-index:5;

    border-top:
        1px solid rgba(255,255,255,.08);
}

.area-envio input{
    flex:1;

    padding:14px 17px;

    border:none;

    border-radius:25px;

    background:
        rgba(255,255,255,.10);

    color:white;

    outline:none;

    font-size:15px;

    border:
        1px solid rgba(255,255,255,.08);
}

.area-envio input::placeholder{
    color:#c9a6ca;
}

.area-envio button{
    width:50px;
    height:50px;

    border:none;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #ff1493,
            #8a2be2
        );

    color:white;

    font-size:20px;

    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<header>

<div
class="voltar"
onclick="voltar()">
‹
</div>

<div class="info">

<h1 id="nomeDestinatario">
Carregando...
</h1>

<p>💋 Fifi • Conversa</p>

</div>

<button
class="apagar"
onclick="apagarConversa()"
title="Apagar conversa">

🗑️

</button>

</header>

<div
class="mensagens"
id="mensagens">

<div class="vazio">
Carregando mensagens...
</div>

</div>

<div class="area-envio">

<input
type="text"
id="campoMensagem"
placeholder="Digite uma mensagem..."
autocomplete="off"
>

<button onclick="enviarMensagem()">
➤
</button>

</div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


const SUPABASE_URL =
"https://fviycyrnixbodpsilxuo.supabase.co";


const SUPABASE_KEY =
"sb_publishable_MNkJhCDo4ToSb98V2rBPNA_Ubphvhw1";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// IDs DO USUÁRIO

const usuarioId =
    localStorage.getItem("chat_usuario_id");

const destinatarioId =
    localStorage.getItem("chat_destinatario_id");


console.log(
    "USUÁRIO:",
    usuarioId
);

console.log(
    "DESTINATÁRIO:",
    destinatarioId
);


// VERIFICAÇÃO

if(!usuarioId || !destinatarioId){

    alert(
        "Não foi possível identificar a conversa."
    );

    window.location.href =
        "chat.html";

}


// CARREGAR NOME

async function carregarDestinatario(){

    const { data, error } =
        await supabase
        .from("usuarios")
        .select("nome")
        .eq("id", destinatarioId)
        .maybeSingle();


    if(error){

        console.error(
            "Erro destinatário:",
            error
        );

        return;
    }


    if(data){

        document.getElementById(
            "nomeDestinatario"
        ).textContent =
            data.nome;

    }

}


// CARREGAR MENSAGENS

async function carregarMensagens(){

    const area =
        document.getElementById(
            "mensagens"
        );


    const { data, error } =
        await supabase
        .from("mensagens")
        .select(
            "id,remetente_id,destinatario_id,mensagem,created_at,lida"
        )
        .or(
            `and(remetente_id.eq.${usuarioId},destinatario_id.eq.${destinatarioId}),and(remetente_id.eq.${destinatarioId},destinatario_id.eq.${usuarioId})`
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "Erro mensagens:",
            error
        );

        area.innerHTML = `
            <div class="vazio">
                Erro ao carregar mensagens.
            </div>
        `;

        return;
    }


    if(!data || data.length === 0){

        area.innerHTML = `
            <div class="vazio">
                Nenhuma mensagem ainda. 💋
                <br>
                Diga olá!
            </div>
        `;

        return;
    }


    area.innerHTML = "";


    data.forEach(msg => {

        const div =
            document.createElement(
                "div"
            );


        const minhaMensagem =
            String(
                msg.remetente_id
            ) ===
            String(
                usuarioId
            );


        div.className =
            "mensagem " +
            (
                minhaMensagem
                ? "enviada"
                : "recebida"
            );


        const texto =
            document.createElement(
                "div"
            );


        texto.textContent =
            msg.mensagem;


        const hora =
            document.createElement(
                "div"
            );


        hora.className =
            "hora";


        const dataMensagem =
            new Date(
                msg.created_at
            );


        hora.textContent =
            dataMensagem.toLocaleTimeString(
                "pt-BR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );


        div.appendChild(texto);

        div.appendChild(hora);

        area.appendChild(div);

    });


    area.scrollTop =
        area.scrollHeight;

}


// ENVIAR

window.enviarMensagem =
async function(){

    const campo =
        document.getElementById(
            "campoMensagem"
        );


    const texto =
        campo.value.trim();


    if(!texto){

        return;

    }


    campo.disabled = true;


    const { data, error } =
        await supabase
        .from("mensagens")
        .insert({

            remetente_id:
                Number(usuarioId),

            destinatario_id:
                Number(destinatarioId),

            mensagem:
                texto,

            lida:
                false

        })
        .select()
        .single();


    campo.disabled = false;


    if(error){

        console.error(
            "Erro ao enviar:",
            error
        );

        alert(
            "Erro ao enviar:\n" +
            error.message
        );

        return;

    }


    campo.value = "";

    campo.focus();


    // MOSTRA IMEDIATAMENTE

    await carregarMensagens();

};


// APAGAR CONVERSA

window.apagarConversa =
async function(){

    const confirmar =
        confirm(
            "🗑️ Apagar toda a conversa?\n\n" +
            "Todas as mensagens entre vocês serão apagadas."
        );


    if(!confirmar){

        return;

    }


    const { error } =
        await supabase
        .from("mensagens")
        .delete()
        .or(
            `and(remetente_id.eq.${usuarioId},destinatario_id.eq.${destinatarioId}),and(remetente_id.eq.${destinatarioId},destinatario_id.eq.${usuarioId})`
        );


    if(error){

        console.error(error);

        alert(
            "Erro ao apagar conversa:\n" +
            error.message
        );

        return;

    }


    window.location.href =
        "chat.html";

};


// VOLTAR

window.voltar =
function(){

    // IMPORTANTE:
    // NÃO apagar destinatario_id

    window.location.href =
        "chat.html";

};


// ENTER

document
.getElementById(
    "campoMensagem"
)
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            enviarMensagem();

        }

    }
);


// REALTIME

supabase
.channel(
    "chat-" +
    usuarioId +
    "-" +
    destinatarioId
)
.on(
    "postgres_changes",
    {
        event:"INSERT",
        schema:"public",
        table:"mensagens"
    },
    function(payload){

        const msg =
            payload.new;


        const pertence =
            (
                String(msg.remetente_id) ===
                String(usuarioId)
                &&
                String(msg.destinatario_id) ===
                String(destinatarioId)
            )
            ||
            (
                String(msg.remetente_id) ===
                String(destinatarioId)
                &&
                String(msg.destinatario_id) ===
                String(usuarioId)
            );


        if(pertence){

            carregarMensagens();

        }

    }
)
.subscribe();


carregarDestinatario();

carregarMensagens();

</script>

</body>

</html>
